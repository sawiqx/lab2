services:
  # Consul - сервис для обнаружения микросервисов (Service Discovery) из ЛР2
  consul:
    image: hashicorp/consul:1.17
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    networks:
      - lab2_net

  # Auth Service (ЛР2): регистрация и выдача JWT токенов
  auth:
    build: ./auth_service
    container_name: auth
    ports:
      - "8001:8000"
    environment:
      - SECRET_KEY=my_super_secret_lab_key
    networks:
      - lab2_net

  # Catalog Service (ЛР2): первый экземпляр каталога товаров
  catalog-1:
    build: ./catalog_service
    container_name: catalog-1
    ports:
      - "8002:8000"
    environment:
      - INSTANCE_NAME=catalog-1
      - PORT=8000
    networks:
      - lab2_net

  # Catalog Service (ЛР2): второй экземпляр для балансировки нагрузки
  catalog-2:
    build: ./catalog_service
    container_name: catalog-2
    environment:
      - INSTANCE_NAME=catalog-2
      - PORT=8000
    networks:
      - lab2_net

  # Nginx (ЛР2): обратный прокси и балансировщик
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - catalog-1
      - catalog-2
    networks:
      - lab2_net

  # GraphQL Gateway (ЛР3): шлюз для агрегации данных
  graphql-gateway:
    build: ./graphql_gateway
    container_name: graphql-gateway
    ports:
      - "8003:8000"
    depends_on:
      - catalog-1
    networks:
      - lab2_net

  # RabbitMQ (ЛР4): брокер сообщений
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - lab2_net

  # ==========================================
  # НОВОЕ ДЛЯ ЛР6: KAFKA
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - lab2_net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - lab2_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080" # Снаружи будет доступно на localhost:8081 (8080 занят Nginx)
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - lab2_net
  # ==========================================

  # Order Service (ЛР4, ЛР5, ЛР6): теперь работает с Kafka
  order-service:
    build: 
      context: . 
      dockerfile: order_service/Dockerfile
    container_name: order-service
    restart: on-failure
    ports:
      - "8004:8000" # Внутри контейнера приложение должно слушать 8000!
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092 # Передаем адрес Kafka
    depends_on:
      - rabbitmq
      - payment-service
      - kafka # Ждем запуска Kafka
    networks:
      - lab2_net

  # Payment Service (ЛР4 и ЛР5): без изменений
  payment-service:
    build: 
      context: . 
      dockerfile: payment_service/Dockerfile
    container_name: payment-service
    restart: on-failure
    ports:
      - "50051:50051"
    depends_on:
      - rabbitmq
    networks:
      - lab2_net

  # Notification Service (ЛР4): без изменений
  notification-service:
    build: ./notification_service
    container_name: notification-service
    restart: on-failure
    depends_on:
      - rabbitmq
    networks:
      - lab2_net

  # ==========================================
  # НОВОЕ ДЛЯ ЛР6: СЕРВИС АНАЛИТИКИ
  # ==========================================
  analytics-service:
    build: ./analytics_service
    container_name: analytics-service
    restart: on-failure
    ports:
      - "8005:8000" # Внутри приложение на 8000, снаружи на 8005
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - lab2_net

networks:
  lab2_net:
    driver: bridge