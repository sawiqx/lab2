services:
  consul:
    image: hashicorp/consul:1.17
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    networks:
      - lab2_net

  auth:
    build: ./auth_service
    container_name: auth
    ports:
      - "8001:8000"
    environment:
      - SECRET_KEY=my_super_secret_lab_key
    networks:
      - lab2_net

  catalog-1:
    build: ./catalog_service
    container_name: catalog-1
    ports:
      - "8002:8000"
    environment:
      - INSTANCE_NAME=catalog-1
      - PORT=8000
    networks:
      - lab2_net

  catalog-2:
    build: ./catalog_service
    container_name: catalog-2
    environment:
      - INSTANCE_NAME=catalog-2
      - PORT=8000
    networks:
      - lab2_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - catalog-1
      - catalog-2
    networks:
      - lab2_net

  graphql-gateway:
    build: ./graphql_gateway
    container_name: graphql-gateway
    ports:
      - "8003:8000"
    depends_on:
      - catalog-1
    networks:
      - lab2_net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - lab2_net

  order-service:
    build: 
      context: .
      dockerfile: order_service/Dockerfile
    container_name: order-service
    restart: on-failure
    ports:
      - "8004:8000"
    depends_on:
      - rabbitmq
      - payment-service
    networks:
      - lab2_net

  payment-service:
    build: 
      context: .
      dockerfile: payment_service/Dockerfile
    container_name: payment-service
    restart: on-failure
    ports:
      - "50051:50051"
    depends_on:
      - rabbitmq
    networks:
      - lab2_net

  notification-service:
    build: ./notification_service
    container_name: notification-service
    restart: on-failure
    depends_on:
      - rabbitmq
    networks:
      - lab2_net

networks:
  lab2_net:
    driver: bridge