services:
  # Consul - сервис для обнаружения микросервисов (Service Discovery) из ЛР2
  consul:
    image: hashicorp/consul:1.17
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    networks:
      - lab2_net

  # Auth Service (ЛР2): регистрация и выдача JWT токенов
  auth:
    build: ./auth_service
    container_name: auth
    ports:
      - "8001:8000"
    environment:
      - SECRET_KEY=my_super_secret_lab_key
    networks:
      - lab2_net

  # Catalog Service (ЛР2): первый экземпляр каталога товаров
  catalog-1:
    build: ./catalog_service
    container_name: catalog-1
    ports:
      - "8002:8000"
    environment:
      - INSTANCE_NAME=catalog-1
      - PORT=8000
    networks:
      - lab2_net

  # Catalog Service (ЛР2): второй экземпляр для балансировки нагрузки
  catalog-2:
    build: ./catalog_service
    container_name: catalog-2
    environment:
      - INSTANCE_NAME=catalog-2
      - PORT=8000
    networks:
      - lab2_net

  # Nginx (ЛР2): обратный прокси и балансировщик
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - catalog-1
      - catalog-2
    networks:
      - lab2_net

  # GraphQL Gateway (ЛР3): шлюз для агрегации данных
  graphql-gateway:
    build: ./graphql_gateway
    container_name: graphql-gateway
    ports:
      - "8003:8000"
    depends_on:
      - catalog-1
    networks:
      - lab2_net

  # RabbitMQ (ЛР4): брокер сообщений
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Порт для обмена сообщениями
      - "15672:15672" # Порт для веб-панели управления
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - lab2_net

  # Order Service (ЛР4 и ЛР5): создает заказы и вызывает gRPC через Circuit Breaker
  order-service:
    build: 
      context: . # Контекст сборки - корень проекта, чтобы видеть папку proto (ЛР5)
      dockerfile: order_service/Dockerfile
    container_name: order-service
    restart: on-failure
    ports:
      - "8004:8000" # Порт для Swagger
    depends_on:
      - rabbitmq
      - payment-service
    networks:
      - lab2_net

  # Payment Service (ЛР4 и ЛР5): обрабатывает оплату через RabbitMQ и gRPC
  payment-service:
    build: 
      context: . # Контекст сборки - корень проекта, чтобы видеть папку proto (ЛР5)
      dockerfile: payment_service/Dockerfile
    container_name: payment-service
    restart: on-failure
    ports:
      - "50051:50051" # Порт для gRPC-сервера (ЛР5)
    depends_on:
      - rabbitmq
    networks:
      - lab2_net

  # Notification Service (ЛР4): слушает события и отправляет уведомления
  notification-service:
    build: ./notification_service
    container_name: notification-service
    restart: on-failure
    depends_on:
      - rabbitmq
    networks:
      - lab2_net

# Общая сеть, чтобы все контейнеры видели друг друга по именам
networks:
  lab2_net:
    driver: bridge